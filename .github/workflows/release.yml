name: Release Build

# 推送 v* 标签 → 三/四平台自动构建并发布 Release（安装包挂到 Releases 页）
# 手动触发（workflow_dispatch）→ 仅构建并把安装包上传为工作流产物，用于验证
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write # tauri-action 创建 Release 需要
    strategy:
      fail-fast: false # 一个平台失败不取消其他平台
      matrix:
        include:
          - platform: windows-latest # Windows x64 → .msi (WiX, zh-CN)
            args: ''
          - platform: ubuntu-22.04 # Linux → .deb / .rpm / .AppImage
            args: ''
          - platform: macos-latest # Apple Silicon (M1/M2/M3) → .dmg / .app
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest # Intel Mac → .dmg / .app
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'aarch64-apple-darwin') && 'aarch64-apple-darwin' || contains(matrix.args, 'x86_64-apple-darwin') && 'x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies (WebKitGTK 等)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build & Release (tag 时) / Build only (手动触发时)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'BookFlow v__VERSION__'
          releaseBody: '从下方 Assets 下载对应平台的安装包。Windows (.msi) / macOS (.dmg) / Linux (.deb, .rpm, .AppImage)。'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
